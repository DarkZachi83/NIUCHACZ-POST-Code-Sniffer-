# Wydanie dla Windows: buduje NIUCHACZ.exe (PyInstaller) na serwerze GitHuba z Windowsem,
# uruchamia testy i publikuje paczkę ZIP w zakładce Releases.
# Nowe wydanie: zmień __version__ w niuchacz/__init__.py i wypchnij na main. Automat sam utworzy
# znacznik v<wersja> i wydanie; jeśli wydanie o tym numerze już jest, zbuduje tylko artefakt.
# Ręcznie: zakładka Actions -> Windows release -> Run workflow.
name: Windows release

on:
  push:
    branches: [main]
    paths:
      - "niuchacz/__init__.py"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyserial pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build NIUCHACZ.exe
        run: >
          pyinstaller --noconfirm --windowed --name NIUCHACZ
          --icon assets/niuchacz.ico
          --add-data "niuchacz/i18n/*.json;niuchacz/i18n"
          --hidden-import serial.tools.list_ports
          main.py

      - name: Version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path niuchacz/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "TAG=v$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          gh release view "v$v" *> $null
          $new = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          "NEW_RELEASE=$new" | Out-File -FilePath $env:GITHUB_ENV -Append
          $global:LASTEXITCODE = 0

      - name: Assemble package
        shell: pwsh
        run: |
          $ver = $env:TAG
          $dst = "dist/NIUCHACZ"
          Copy-Item -Recurse assets, config, firmware, enclosure "$dst/"
          New-Item -ItemType Directory -Force "$dst/data", "$dst/data/golden_runs", "$dst/reports", "$dst/docs" | Out-Null
          Copy-Item -Recurse data/post_codes "$dst/data/"
          Copy-Item -Recurse docs/* "$dst/docs/"
          Copy-Item README.md, LICENSE "$dst/"
          Compress-Archive -Path "$dst" -DestinationPath "NIUCHACZ-$ver-windows-x64.zip"
          "ZIP=NIUCHACZ-$ver-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/NIUCHACZ/NIUCHACZ.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "NIUCHACZ.exe exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: NIUCHACZ-windows-x64
          path: ${{ env.ZIP }}

      - name: Publish GitHub release
        if: env.NEW_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:TAG" "$env:ZIP" --target "$env:GITHUB_SHA" --title "NIUCHACZ $env:TAG" --notes-file docs/RELEASE_NOTES.md
